name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIGITAL_OCEAN_HOST }}
          username: root
          key: ${{ secrets.DIGITAL_OCEAN_PRIVATE_KEY }}
          script: |
            su - app -c 'bash -s' << 'EOF'
            cd /home/app/app 2>/dev/null || git clone https://github.com/nivekithan/local-tunnel.git /home/app/app
            cd /home/app/app
            git fetch origin && git reset --hard origin/main
            pnpm install
            pm2 describe local-tunnel-server >/dev/null 2>&1 && pm2 restart local-tunnel-server || pm2 start "turbo start --filter=server" --name local-tunnel-server
            pm2 save
            EOF
