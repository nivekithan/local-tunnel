name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Digital Ocean VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIGITAL_OCEAN_HOST }}
          username: root
          key: ${{ secrets.DIGITAL_OCEAN_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # Switch to app user and run deployment commands
            su - app << 'EOF'
            cd ~
            
            # Clone or update repository
            if [ ! -d "app" ]; then
              echo "Cloning repository..."
              git clone https://github.com/nivekithan/local-tunnel.git app
              cd app
            else
              echo "Updating repository..."
              cd app
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            fi
            
            # Install dependencies
            echo "Installing dependencies..."
            pnpm install
            
            # Manage PM2 process
            echo "Managing PM2 process..."
            if pm2 describe local-tunnel-server > /dev/null 2>&1; then
              echo "Restarting existing PM2 process..."
              pm2 restart local-tunnel-server
            else
              echo "Starting new PM2 process..."
              pm2 start "turbo start --filter=server" --name local-tunnel-server
            fi
            
            # Save PM2 process list
            pm2 save
            
            echo "Deployment completed successfully!"
            EOF
